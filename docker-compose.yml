services:
  postgres:
    image: postgres:17-alpine
    container_name: marmur-flowers-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: marmur_flowers
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marmur_flowers"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
